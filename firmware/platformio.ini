; PlatformIO project for the Team 05 fall-detection band.
; Board: ESP32-S3-N16R8 (16MB flash, 8MB octal PSRAM).
; See CLAUDE.md "Hardware" section for pin assignments.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8: Quad SPI flash (16MB) + Octal SPI PSRAM (8MB).
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
