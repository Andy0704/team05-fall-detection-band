; PlatformIO project for the Team 05 fall-detection band.
; Board: ESP32-S3-N16R8 (16MB flash, 8MB octal PSRAM).
; See CLAUDE.md "Hardware" section for pin assignments.
;
; This file lives at the repo root so PlatformIO Home / the VS Code extension
; detect the project when the repo folder is opened. Sources stay in firmware/.

[platformio]
src_dir = firmware/src
include_dir = firmware/include

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8: Quad SPI flash (16MB) + Octal SPI PSRAM (8MB).
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; Injects FIRMWARE_GIT_COMMIT for the log header (CLAUDE.md code rule 5).
extra_scripts = pre:firmware/git_version.py

; QAPASS 1602A LCD (parallel HD44780, no I2C backpack).
lib_deps = arduino-libraries/LiquidCrystal@^1.0.7
